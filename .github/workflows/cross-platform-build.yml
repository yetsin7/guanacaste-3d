name: Guanacaste 3D cross-platform desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guanacaste-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  avalonia:
    name: Avalonia ${{ matrix.os }} ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore cross-platform desktop
        run: dotnet restore src/Guanacaste3D.CrossPlatform/Guanacaste3D.CrossPlatform.csproj
      - name: Compile cross-platform desktop
        run: dotnet build src/Guanacaste3D.CrossPlatform/Guanacaste3D.CrossPlatform.csproj --configuration Release --no-restore
      - name: Run portable model snapping checks
        run: dotnet run --project tests/cross-platform-snapping-checks/cross-platform-snapping-checks.csproj --configuration Release
      - name: Publish self-contained desktop
        run: dotnet publish src/Guanacaste3D.CrossPlatform/Guanacaste3D.CrossPlatform.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output artifacts/guanacaste-${{ matrix.rid }}
      - name: Upload portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Guanacaste3D-crossplatform-${{ matrix.rid }}
          path: artifacts/guanacaste-${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
