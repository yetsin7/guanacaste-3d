name: Rust migration validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'src/Guanacaste3D.Core/**'
      - 'src/Guanacaste3D.Desktop/resources/localization.*.xaml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/rust-migration.yml'
      - 'Plan de migración.md'
  pull_request:
    paths:
      - 'rust/**'
      - 'src/Guanacaste3D.Core/**'
      - 'src/Guanacaste3D.Desktop/resources/localization.*.xaml'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/rust-migration.yml'
      - 'Plan de migración.md'
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable toolchain
        run: rustup default stable
      - name: Install .NET 10 for C# serializer parity
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests and C# serializer parity
        env:
          GUANACASTE_CSHARP_PARITY: '1'
        run: cargo test --workspace --all-targets
