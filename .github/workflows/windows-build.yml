name: Windows .NET checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Guanacaste3D.slnx
      - name: Compile
        run: dotnet build Guanacaste3D.slnx -c Release --no-restore
      - name: Core checks
        run: dotnet run --project tests/Guanacaste3D.Checks/Guanacaste3D.Checks.csproj -c Release --no-build
