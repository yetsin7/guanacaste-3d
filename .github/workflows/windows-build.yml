name: Guanacaste 3D core and Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending runner minutes on superseded commits of the same ref.
concurrency:
  group: guanacaste-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Reject accidentally tracked local crash diagnostics
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(ErrorReports|CrashDumps)/|\.(log|dmp|mdmp|hdmp|wer)$'; then
            echo "::error::Machine-local crash logs and dumps must not be committed."
            exit 1
          fi
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore core checks
        run: dotnet restore tests/Guanacaste3D.Checks/Guanacaste3D.Checks.csproj
      - name: Restore BIM audit regression suite
        run: dotnet restore tests/model-audit-checks/model-audit-checks.csproj
      - name: Build BIM audit regression suite
        run: dotnet build tests/model-audit-checks/model-audit-checks.csproj -c Release --no-restore
      - name: Run BIM audit and severity regression suite
        run: dotnet run --project tests/model-audit-checks/model-audit-checks.csproj -c Release --no-build --no-restore
      - name: Build core and checks
        run: dotnet build tests/Guanacaste3D.Checks/Guanacaste3D.Checks.csproj -c Release --no-restore
      - name: Run domain, persistence and interoperability regressions
        run: dotnet run --project tests/Guanacaste3D.Checks/Guanacaste3D.Checks.csproj -c Release --no-build --no-restore

  desktop:
    name: Windows WPF build and portable package
    needs: core
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Guanacaste3D.slnx
      - name: Compile
        run: dotnet build Guanacaste3D.slnx -c Release --no-restore
      - name: Core regression checks on Windows
        run: dotnet run --project tests/Guanacaste3D.Checks/Guanacaste3D.Checks.csproj -c Release --no-build --no-restore
      - name: Documentation model and WPF interaction checks
        run: dotnet run --project tests/documentation-checks/documentation-checks.csproj -c Release --no-build --no-restore
      - name: Model workspace 3D and material regressions
        timeout-minutes: 12
        run: dotnet run --project tests/model-workspace-checks/model-workspace-checks.csproj -c Release --no-build --no-restore
      # Exercise the actual Revit-like Architecture ribbon in WPF, not just compilation.
      - name: Architecture ribbon and BIM command interaction regressions
        timeout-minutes: 10
        run: dotnet run --project tests/architecture-ui-checks/architecture-ui-checks.csproj -c Release --no-build --no-restore
      # Cover real WPF placement, editing, native save/reopen, linked imports,
      # family samples and render-panel interaction before publishing a package.
      - name: Desktop interaction and persistence regressions
        timeout-minutes: 10
        run: dotnet run --project tests/desktop-interaction-checks/desktop-interaction-checks.csproj -c Release --no-build --no-restore
      - name: Upload Architecture ribbon UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guanacaste3D-architecture-ui-evidence
          path: artifacts/interaction-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload model workspace interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Guanacaste3D-model-workspace-evidence
          path: artifacts/model-workspace-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish self-contained portable Windows app
        run: dotnet publish src/Guanacaste3D.Desktop/Guanacaste3D.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/portable-win-x64
      - name: Verify executable and write checksum
        shell: pwsh
        run: |
          $exe = 'artifacts/portable-win-x64/Guanacaste3D.Desktop.exe'
          if (-not (Test-Path $exe)) { throw 'Missing expected Windows executable.' }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Guanacaste3D.Desktop.exe" | Set-Content -Path 'artifacts/portable-win-x64/SHA256SUMS.txt' -Encoding ascii
      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: Guanacaste3D-win-x64
          path: artifacts/portable-win-x64/
          if-no-files-found: error
          retention-days: 14
