name: Windows .NET build and package
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify .NET 10
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Environment
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks
      - name: Restore
        run: dotnet restore Guanacaste3D.slnx
      - name: Compile
        run: dotnet build Guanacaste3D.slnx -c Release --no-restore
      - name: Core regression checks
        run: dotnet run --project tests/Guanacaste3D.Checks/Guanacaste3D.Checks.csproj -c Release --no-build
      - name: Publish portable Windows app
        run: dotnet publish src/Guanacaste3D.Desktop/Guanacaste3D.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/win-x64
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Guanacaste3D-win-x64
          path: dist/win-x64/
          if-no-files-found: error
          retention-days: 14
